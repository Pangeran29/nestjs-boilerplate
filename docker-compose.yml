services:
  klinik-ku-postgres:
    image: postgres:latest
    container_name: klinik-ku-postgres
    hostname: postgres
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  klinik-ku-migrate:
    image: node:alpine
    container_name: klinik-ku-migrate
    depends_on:
      klinik-ku-postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: sh -c "npx prisma migrate deploy"

  klinik-ku-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klinik-ku-api
    ports:
      - ${PORT}:${PORT}
    restart: always
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      # Wait for both postgres and migration to be ready
      klinik-ku-postgres:
        condition: service_healthy
      klinik-ku-migrate:
        condition: service_started  # Note: service_started doesn't guarantee success, it's just the container start.
volumes:
  db:
